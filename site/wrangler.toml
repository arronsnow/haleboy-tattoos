# Cloudflare config. @astrojs/cloudflare v14 deploys a Worker with static assets
# (the successor to Pages; Pages Functions can't run Cron Triggers). The adapter
# fills in `main` and the ASSETS binding at build time.
name = "haleboy-tattoos"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# D1: featured pieces, flash sheet, portrait and Instagram metadata.
# Placeholder ID: run `npx wrangler d1 create haleboy` and paste the database_id.
[[d1_databases]]
binding = "DB"
database_name = "haleboy"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# R2: uploaded images and copied Instagram media.
# Create with `npx wrangler r2 bucket create haleboy-media` (bucket names need no ID).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "haleboy-media"

# KV: Instagram feed cache and token state.
# Placeholder ID: run `npx wrangler kv namespace create IG_CACHE` and paste the id.
[[kv_namespaces]]
binding = "IG_CACHE"
id = "00000000000000000000000000000000"

# Cloudflare Images binding, used to resize uploads and strip EXIF.
[images]
binding = "IMAGES"

# The hourly Instagram refresh runs in workers/ig-cron (its own wrangler.toml and Cron Trigger).
